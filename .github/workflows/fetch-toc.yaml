name: fetch-toc
run-name: Fetch TOC graphics (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python _scripts/fetch_toc.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/toc
          git commit -m "Fetch candidate TOC graphics" || echo "nothing to commit"
          git push
