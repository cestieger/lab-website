name: tmp-screenshot
on:
  push:
    branches: [tmp-screenshot]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p tmp-template && cd tmp-template
          curl -sSL -A "Mozilla/5.0" -o untamed.zip https://templated.live/untamed/download/untamed.zip || true
          ls -la; unzip -o -q untamed.zip -d untamed || true
          find . -maxdepth 4 | head -60
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: |
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs'); const path = require('path');
          function find(d){ for (const f of fs.readdirSync(d,{withFileTypes:true})) { const p=path.join(d,f.name); if (f.isDirectory()) { const r=find(p); if (r) return r; } else if (f.name==='index.html') return p; } return null; }
          (async () => { const b = await chromium.launch();
            const idx = fs.existsSync('tmp-template/untamed') ? find('tmp-template/untamed') : null;
            const url = idx ? 'file://' + path.resolve(idx) : 'https://templated.live/untamed/';
            console.log('shooting', url);
            for (const [w,h,f] of [[1400,900,'untamed-desktop.png'],[390,800,'untamed-phone.png']]) {
              const p = await b.newPage({viewport:{width:w,height:h}});
              await p.goto(url, {waitUntil:'networkidle', timeout:60000}).catch(()=>{});
              await p.waitForTimeout(2500);
              await p.screenshot({path:'tmp-template/'+f, fullPage:true});
            }
            await b.close(); })();
          JS
          node s.js
      - run: |
          rm -f tmp-template/untamed.zip
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-template && git commit -m "tmp template" && git push
